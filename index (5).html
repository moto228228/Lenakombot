<!DOCTYPE html>
<html lang="ru">
<head>

<style>
/* Файтинг: ночная арена, закатное небо, сцена на весь экран, кнопки поверх игры. */
:root {
  --bg: #0b0d1a;
  --fg: #f4ecd8;
  --accent: #ff6a2b;
  --accent2: #5b7bff;
  --btn: rgba(14, 16, 36, .55);
  --btn-on: rgba(255, 106, 43, .8);
  color-scheme: dark;
}
html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { position: fixed; top: 0; left: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#stage { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg); }
#c { display: block; }

#pad { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.cluster { position: absolute; bottom: max(10px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.left { left: max(14px, env(safe-area-inset-left, 0px)); grid-template-columns: repeat(3, var(--s)); grid-template-rows: repeat(2, var(--s)); }
.right { right: max(14px, env(safe-area-inset-right, 0px)); grid-template-columns: repeat(2, var(--s2)); grid-template-rows: repeat(2, var(--s2)); }
#pad { --s: clamp(52px, 17vh, 82px); --s2: clamp(58px, 19vh, 92px); }
.b {
  pointer-events: auto; border: 2px solid rgba(255, 236, 200, .55); background: var(--btn); color: var(--fg);
  border-radius: 50%; font: inherit; font-size: clamp(14px, 4.2vh, 24px); letter-spacing: .04em;
  display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none;
  -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.b.on { background: var(--btn-on); transform: scale(.94); }
.b.sq { border-radius: 16px; }
.b.sup { border-color: #ffd36b; color: #ffd36b; }
.b:focus-visible { outline: 3px solid #fff; }
.u { grid-column: 2; grid-row: 1; } .l { grid-column: 1; grid-row: 2; } .d { grid-column: 2; grid-row: 2; } .r { grid-column: 3; grid-row: 2; }
.bl { grid-column: 1; grid-row: 1; } .sp { grid-column: 2; grid-row: 1; } .pu { grid-column: 1; grid-row: 2; } .ki { grid-column: 2; grid-row: 2; }

#rotate {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; display: none; align-items: center; justify-content: center; text-align: center;
  background: var(--bg); font-size: 34px; letter-spacing: .06em; padding: 24px; line-height: 1.2;
}
@media (orientation: portrait) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) { .b.on { transform: none; } }

/* ---- меню ---- */
:root { --nav: calc(clamp(50px, 15vh, 64px) + env(safe-area-inset-bottom, 0px)); }
#menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; background: #0b0820; transition: opacity .3s; }
#menu.hide { opacity: 0; pointer-events: none; }
#panels { position: absolute; top: 0; left: 0; right: 0; bottom: var(--nav); overflow: hidden; }
.panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); }
.panel.active { display: flex; }
.panel.enter { z-index: 2; animation: pIn .55s cubic-bezier(.2, .75, .25, 1) both; }
.panel.leave { z-index: 1; animation: pOut .4s ease both; }
@keyframes pIn {
  from { -webkit-clip-path: inset(38% 38% 38% 38% round 30px); clip-path: inset(38% 38% 38% 38% round 30px); transform: scale(.8); opacity: .2; }
  to { -webkit-clip-path: inset(0% 0% 0% 0% round 0px); clip-path: inset(0% 0% 0% 0% round 0px); transform: scale(1); opacity: 1; }
}
@keyframes pOut { from { transform: scale(1); opacity: 1; } to { transform: scale(.9); opacity: 0; } }
.panel[data-p="story"] { background: radial-gradient(ellipse at 50% 30%, #4b2a7a, #1a0f35 70%); }
.panel[data-p="fight"] { background: radial-gradient(ellipse at 50% 80%, #8a2e24, #2a1038 55%, #0f0a2c); }
.panel[data-p="towers"] { background: radial-gradient(ellipse at 50% 30%, #1f4a8a, #0c1736 70%); }
.panel[data-p="pot"] { background: radial-gradient(ellipse at 50% 20%, #1c6a66, #0d2433 70%); }
.ptitle { font-size: clamp(26px, 8vh, 46px); letter-spacing: .08em; text-shadow: 0 3px 0 #0b0914; margin: 0 0 4px; }
.soon { font-size: clamp(40px, 16vh, 80px); color: #ffd36b; text-shadow: 0 4px 0 #0b0914; }
.sub { font-size: clamp(14px, 4vh, 20px); color: #cbbfa6; letter-spacing: .05em; text-align: center; }
#nav { position: absolute; left: 0; right: 0; bottom: 0; height: var(--nav); box-sizing: border-box; display: flex; gap: 10px; align-items: stretch; justify-content: center;
  padding: 7px max(14px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: rgba(8, 6, 20, .95); border-top: 2px solid rgba(255, 236, 200, .15); }
.tab { flex: 1; max-width: 190px; border: 2px solid rgba(255, 236, 200, .3); border-radius: 14px; background: rgba(255, 255, 255, .07); color: var(--fg); font: inherit;
  font-size: clamp(15px, 4.6vh, 24px); letter-spacing: .06em; padding: 0; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent;
  transform: scale(.9); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), background .3s, border-color .3s, color .3s; }
.tab.active { transform: scale(1.12); background: var(--accent); border-color: #ffd36b; color: #1a0a05; }
.frow { display: flex; align-items: center; gap: clamp(14px, 4vw, 40px); }
.frow canvas { width: clamp(110px, 30vh, 190px); height: clamp(130px, 52vh, 250px); }
.fcol { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.cta { font: inherit; font-size: clamp(28px, 9vh, 48px); letter-spacing: .08em; padding: 4px 34px; border-radius: 16px; border: 3px solid #ffd36b; background: linear-gradient(#ff8a3a, #d63a2c); color: #fff;
  text-shadow: 0 2px 0 #0b0914; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; }
.cta:active { transform: scale(.96); }
#roster { display: flex; gap: 10px; width: 100%; flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-x; padding: 4px 2px 6px; box-sizing: border-box; }
.card { flex: 1 0 128px; min-width: 128px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 6px 8px; font: inherit; color: var(--fg); text-align: center;
  background: rgba(8, 6, 20, .55); border: 2px solid rgba(255, 236, 200, .25); border-radius: 16px; -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; transition: border-color .25s, background .25s, transform .25s; }
.card canvas { width: 100%; flex: 1; min-height: 60px; }
.card .cn { font-size: clamp(20px, 6vh, 28px); letter-spacing: .06em; }
.card .cm { font-size: clamp(11px, 3vh, 14px); color: #e6d9bf; font-family: -apple-system, Arial, sans-serif; line-height: 1.2; }
.card .cs { font-size: clamp(10px, 2.7vh, 13px); color: #9fe9d6; font-family: -apple-system, Arial, sans-serif; line-height: 1.2; }
.card .ok { display: none; font-size: 15px; color: #1a0a05; background: #ffd36b; border-radius: 8px; padding: 0 10px; margin-top: 3px; }
.card.sel { border-color: #ffd36b; background: rgba(255, 170, 60, .16); transform: scale(1.02); }
.card.sel .ok { display: block; }
#back { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); pointer-events: auto; font: inherit; font-size: clamp(13px, 3.8vh, 18px);
  letter-spacing: .06em; color: var(--fg); background: var(--btn); border: 2px solid rgba(255, 236, 200, .45); border-radius: 12px; padding: 4px 14px; -webkit-appearance: none; appearance: none; touch-action: none; }
body:not(.fight) #pad { display: none; }
.cine .cluster .b { pointer-events: none; opacity: 0; transition: opacity .3s; }
</style>

</head>
<body>
<div id="stage"><canvas id="c" aria-label="Игровое поле"></canvas></div>
<div id="pad">
  <div class="cluster left">
    <button class="b u" data-h="up" aria-label="Прыжок">▲</button>
    <button class="b l" data-h="left" aria-label="Влево">◀</button>
    <button class="b d" data-h="down" aria-label="Присесть">▼</button>
    <button class="b r" data-h="right" aria-label="Вправо">▶</button>
  </div>
  <div class="cluster right">
    <button class="b sq bl" data-h="block">БЛОК</button>
    <button class="b sq sp sup" data-q="super">СУПЕР</button>

    <button class="b sq ki" data-q="kick">НОГА</button>
  </div>

</div>
<div id="menu">
  <div id="panels">
    <section class="panel" data-p="story"><div class="ptitle">СЮЖЕТ</div><div class="soon">СКОРО</div><div class="sub">История арены появится здесь</div></section>
    <section class="panel" data-p="fight">
      <div class="frow">
        <canvas id="selPrev"></canvas>
        <div class="fcol">
          <div class="ptitle">АРЕНА ТЕНЕЙ</div>
          <div class="sub" style="text-align:left">ТВОЙ БОЕЦ: <span id="selName" style="color:#ffd36b"></span></div>
          <button class="cta" id="goFight">В БОЙ</button>
          <div class="sub" style="text-align:left;font-size:clamp(12px,3.4vh,16px)">Победи в двух раундах из трёх.<br>Сменить бойца можно во вкладке «Потенциал».</div>
        </div>
      </div>
    </section>
    <section class="panel" data-p="towers"><div class="ptitle">БАШНИ</div><div class="soon">СКОРО</div><div class="sub">Испытания на выживание появятся здесь</div></section>
    <section class="panel" data-p="pot"><div class="ptitle">ПОТЕНЦИАЛ</div><div id="roster" class="scrollable"></div></section>
  </div>
  <nav id="nav">
    <button class="tab" data-t="story">СЮЖЕТ</button>
    <button class="tab active" data-t="fight">БОИ</button>
    <button class="tab" data-t="towers">БАШНИ</button>
    <button class="tab" data-t="pot">ПОТЕНЦИАЛ</button>
  </nav>
</div>
<div id="rotate">Поверните телефон горизонтально</div>

<script>
(() => {
'use strict';
const W = 960, H = 540, GROUND = 438, WORLD = 1500, MAXD = 760;
const $ = (id) => document.getElementById(id);
const cv = $('c'); let ctx = cv.getContext('2d'); const mainCtx = ctx;
const FONT = "'Bebas Neue', Impact, 'Arial Narrow', sans-serif";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
let seed = 7;
const srnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

// ---------- размер ----------
let scale = 1;
function resize() {
  const vv = window.visualViewport;
  const vw = Math.round(window.innerWidth || document.documentElement.clientWidth || (vv && vv.width) || 0);
  const vh = Math.round(window.innerHeight || document.documentElement.clientHeight || (vv && vv.height) || 0);
  if (!vw || !vh) { setTimeout(resize, 100); return; }
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.max(1, Math.round(W * scale * dpr));
  cv.height = Math.max(1, Math.round(H * scale * dpr));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { resize(); setTimeout(resize, 150); setTimeout(resize, 500); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('load', resize);
resize();

// iOS: запрет зума, скролла и «резинки»
['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => { if (!(e.target.closest && e.target.closest('.scrollable'))) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());

// если что-то сломается — покажем текст ошибки на экране
window.addEventListener('error', (e) => {
  let d = document.getElementById('err');
  if (!d) { d = document.createElement('div'); d.id = 'err'; d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#b01e1e;color:#fff;font:12px/1.3 monospace;padding:6px;pointer-events:none;'; document.body.appendChild(d); }
  d.textContent = 'Ошибка: ' + e.message + ' (' + (e.lineno || '?') + ')';
});

// ---------- звук ----------
let AC = null, noiseBuf = null;
function audioInit() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC && AC.state !== 'running' && AC.resume) AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, sl) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * sl), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v, fc) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const a = noiseBuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), fl = AC.createBiquadFilter();
  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.value = fc;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d + 0.02);
}
const SFX = {
  surprise: () => { tone(900, .2, 'square', .25, .3); noise(.4, .5, 5000); setTimeout(() => SFX.boom(), 120); },
  laser: () => { tone(2200, .6, 'sawtooth', .12, .3); noise(.5, .15, 6000); },
  whoosh: () => noise(0.12, 0.18, 2400),
  hit: () => { noise(0.12, 0.5, 1800); tone(120, 0.15, 'square', 0.25, 0.4); },
  block: () => { noise(0.08, 0.25, 900); tone(220, 0.08, 'triangle', 0.2, 0.6); },
  super: () => { tone(180, 0.5, 'sawtooth', 0.22, 3); noise(0.5, 0.25, 3000); },
  ko: () => { tone(200, 0.7, 'sawtooth', 0.3, 0.2); noise(0.5, 0.4, 1200); },
  jump: () => tone(300, 0.12, 'sine', 0.1, 1.6),
  ui: () => tone(520, 0.12, 'triangle', 0.2, 1.4),
  gong: () => { tone(92, 2.4, 'sine', .4, .85); tone(138, 2, 'sine', .22, .9); tone(276, 1.2, 'triangle', .1, .9); noise(.7, .25, 600); },
  boom: () => { tone(80, .7, 'sine', .55, .35); noise(.45, .45, 800); },
  sweep: () => { noise(.4, .22, 3500); tone(200, .4, 'sawtooth', .06, 3); },
  drone: () => tone(55, 3.6, 'sawtooth', .07, 1.1),
  sting: () => { [262, 330, 392, 523].forEach((fq, i) => setTimeout(() => { tone(fq, .5, 'sawtooth', .13, 1.01); tone(fq / 2, .6, 'triangle', .15, 1); }, i * 110)); setTimeout(() => SFX.boom(), 480); }
};
let VOICE = null, VOICEF = null, VOICE_MALE = false;
try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { VOICE = null; VOICEF = null; VOICE_MALE = false; }; } catch (e) {}
// выбор мужского голоса: женские и «игрушечные» исключаем, локальные голоса (понимают pitch) ставим выше сетевых
const V_FEM = /female|zira|samantha|victoria|karen|susan|fiona|moira|tessa|hazel|catherine|allison|nicky|kate|serena|libby|sonia|jenny|aria|emma|michelle/i;
const V_TOY = /fred|ralph|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|superstar|trinoids|whisper|wobble|zarvox|albert|agnes/i;
const V_MALE = /daniel|arthur|aaron|david|mark|guy|james|oliver|bruce|alex|rishi|gordon|ryan|christopher|eric|roger|steffan|brian|andrew|davis|george|thomas|male|x-(rjs|gbb|gbd|iol|iom|tpd)/i;
function pickMale(en) {
  const good = en.filter((v) => !V_FEM.test(v.name) && !V_TOY.test(v.name));
  const males = good.filter((v) => V_MALE.test(v.name) || V_MALE.test(v.voiceURI || ''));
  const rank = (v) => (v.localService ? 0 : 2) + (/^en-(us|gb)/i.test(v.lang) ? 0 : 1);
  males.sort((x, y) => rank(x) - rank(y));
  if (males.length) { VOICE_MALE = true; return males[0]; }
  VOICE_MALE = false; // мужского голоса на устройстве нет — берём любой нейтральный и опускаем тон ниже
  return good[0] || en[0] || null;
}
function growl() { tone(62, 1.1, 'sawtooth', .16, .8); tone(93, 1.0, 'square', .07, .7); noise(.9, .22, 320); }
function say(text, pitch, rate, fem) { // грубый диктор как в Mortal Kombat; fem = женский голос
  try {
    const ss = window.speechSynthesis; if (!ss || !window.SpeechSynthesisUtterance) return;
    const en = ss.getVoices().filter((v) => /^en/i.test(v.lang));
    if (fem) { if (!VOICEF) VOICEF = en.find((v) => /female|samantha|victoria|karen|zira|susan|fiona|moira|tessa|google us english/i.test(v.name)) || null; }
    else if (!VOICE) VOICE = pickMale(en);
    ss.cancel(); const u = new SpeechSynthesisUtterance(text); const vo = fem ? (VOICEF || VOICE) : VOICE; if (vo) u.voice = vo;
    // мужской голос найден — умеренно низкий тон; не найден (или голосов ещё нет) — тон ниже, чтобы голос звучал по-мужски
    u.lang = 'en-US'; u.pitch = fem ? 1.15 : (VOICE_MALE ? 0.5 : 0.25); u.rate = 0.85; u.volume = 1;
    // пауза после cancel(): на Android Chrome иначе реплика иногда пропадает
    setTimeout(() => { try { ss.speak(u); } catch (e) {} }, 60);
    if (!fem) growl();
  } catch (e) {}
}

// ---------- ввод ----------
const hold = { left: 0, right: 0, up: 0, down: 0, block: 0 };
const q = { punch: 0, kick: 0, super: 0 };
const keyMap = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', l: 'block', Shift: 'block' };
const actMap = { j: 'punch', z: 'punch', k: 'kick', x: 'kick', ' ': 'super', i: 'super', Enter: 'super' };
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keyMap[k]) { hold[keyMap[k]] = 1; e.preventDefault(); }
  else if (actMap[k]) { if (!e.repeat) q[actMap[k]] = 1; e.preventDefault(); }
  onTap();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keyMap[k]) hold[keyMap[k]] = 0;
});
window.addEventListener('blur', () => { for (const k in hold) hold[k] = 0; });
document.querySelectorAll('[data-h]').forEach((b) => {
  const k = b.dataset.h;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (x) {} } hold[k] = 1; b.classList.add('on'); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((n) => b.addEventListener(n, () => { hold[k] = 0; b.classList.remove('on'); }));
});
document.querySelectorAll('[data-q]').forEach((b) => {
  const k = b.dataset.q;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); q[k] = 1; b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 110); });
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('pointerdown', onTap);
window.addEventListener('touchend', audioInit, { passive: true });

// ---------- данные бойцов ----------

  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
  // пятно света под бойцами
  const cx = (P.x + E.x) / 2;
  g = ctx.createRadialGradient(cx, GROUND + 10, 10, cx, GROUND + 10, 380);
  g.addColorStop(0, 'rgba(255,170,110,.28)'); g.addColorStop(1, 'rgba(255,170,110,0)');
  ctx.save(); ctx.scale(1, 0.22); ctx.translate(0, (GROUND + 10) * (1 / 0.22 - 1)); ctx.fillStyle = g; ctx.fillRect(cx - 400, GROUND + 10 - 90, 800, 180); ctx.restore();
}
function drawBraziers() {
  for (const bx of [330, 1170]) {
    ctx.fillStyle = '#120a1c'; ctx.strokeStyle = '#06030c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx - 20, GROUND - 4); ctx.lineTo(bx - 12, GROUND - 70); ctx.lineTo(bx + 12, GROUND - 70); ctx.lineTo(bx + 20, GROUND - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillRect(bx - 28, GROUND - 82, 56, 14); ctx.strokeRect(bx - 28, GROUND - 82, 56, 14);
    const fl = 1 + Math.sin(G.t * 12 + bx) * 0.12;
    const g = ctx.createRadialGradient(bx, GROUND - 96, 4, bx, GROUND - 96, 150 * fl);
    g.addColorStop(0, 'rgba(255,200,110,.75)'); g.addColorStop(0.3, 'rgba(255,120,40,.3)'); g.addColorStop(1, 'rgba(255,100,30,0)');
    ctx.fillStyle = g; ctx.fillRect(bx - 160, GROUND - 260, 320, 320);
    ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.moveTo(bx - 14, GROUND - 82); ctx.quadraticCurveTo(bx - 8, GROUND - 120 * fl, bx, GROUND - 130 * fl); ctx.quadraticCurveTo(bx + 8, GROUND - 110, bx + 14, GROUND - 82); ctx.fill();
    ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.moveTo(bx - 7, GROUND - 82); ctx.quadraticCurveTo(bx, GROUND - 112 * fl, bx + 7, GROUND - 82); ctx.fill();
  }
}

// ---------- HUD ----------
function txt(s, x, y, size, col, align, stroke) {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const mw = ctx.measureText(s).width;
  if (mw > W - 60) { size = Math.floor(size * (W - 60) / mw); ctx.font = size + 'px ' + FONT; }
  if (stroke) { ctx.lineWidth = Math.max(3, size * 0.12); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function bar(x, y, w, h, f, right) {
  const slant = 14;
  const path = (ww) => {
    ctx.beginPath();
    if (!right) { ctx.moveTo(x, y); ctx.lineTo(x + ww, y); ctx.lineTo(x + ww - slant, y + h); ctx.lineTo(x - slant * 0, y + h); }
    else { const xr = x + w; ctx.moveTo(xr, y); ctx.lineTo(xr - ww, y); ctx.lineTo(xr - ww + slant, y + h); ctx.lineTo(xr, y + h); }
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(8,6,20,.75)'; path(w); ctx.fill();
  ctx.fillStyle = '#fff3c4'; path(w * f.trail / 100); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  const low = f.hp < 30;
  g.addColorStop(0, low ? '#ff6a4a' : '#7dff8a'); g.addColorStop(1, low ? '#b01e1e' : '#1fa84a');
  ctx.fillStyle = g; path(w * f.hp / 100); ctx.fill();
  ctx.strokeStyle = '#f4ecd8'; ctx.lineWidth = 2.5; path(w); ctx.stroke();
}
function drawHUD() {
  const bw = 370, by = 26, bh = 24;
  bar(36, by, bw, bh, P, false); bar(W - 36 - bw, by, bw, bh, E, true);
  txt(P.style.name, 36, by + bh + 20, 26, '#f4ecd8', 'left', '#0b0914');
  txt(E.style.name, W - 36, by + bh + 20, 26, '#f4ecd8', 'right', '#0b0914');
  // раунды
  for (let i = 0; i < 2; i++) {
    for (const [f, x] of [[P, 36 + 90 + i * 22], [E, W - 36 - 90 - i * 22]]) {
      ctx.fillStyle = i < f.wins ? '#ffcf3a' : 'rgba(255,255,255,.18)'; ctx.strokeStyle = '#0b0914'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, by + bh + 20, 7, 0, 7); ctx.fill(); ctx.stroke();
    }
  }
  // таймер
  ctx.fillStyle = 'rgba(8,6,20,.8)'; ctx.strokeStyle = '#f4ecd8'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(W / 2, 44, 30, 0, 7); ctx.fill(); ctx.stroke();
  txt(String(Math.ceil(G.time)), W / 2, 46, 40, G.time <= 10 ? '#ff6a4a' : '#f4ecd8');
  // супер
  for (const [f, x, right] of [[P, 36, false], [E, W - 36 - 200, true]]) {
    const w = 200, y = 86;
    ctx.fillStyle = 'rgba(8,6,20,.7)'; ctx.fillRect(x, y, w, 8);
    const full = f.meter >= 100;
    ctx.fillStyle = full ? (Math.sin(G.t * 12) > 0 ? '#ffe28a' : '#ff9a3a') : '#5b9bff';
    const fw = w * f.meter / 100; ctx.fillRect(right ? x + w - fw : x, y, fw, 8);
    ctx.strokeStyle = '#f4ecd8'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, 8);
    if (full) txt('СУПЕР', right ? x + w + 0 : x + w + 0, y - 8, 18, '#ffd36b', right ? 'right' : 'left', '#0b0914');
  }
}
function banner(s, size, col, k) {
  ctx.save(); ctx.translate(W / 2, H / 2 - 40); const sc = 1 + 0.35 * Math.max(0, 1 - k * 4); ctx.scale(sc, sc);
  txt(s, 0, 0, size, col, 'center', '#0b0914'); ctx.restore();
}
function bars(k) { const h = 58 * clamp(k, 0, 1); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, h); ctx.fillRect(0, H - h, W, h); }
function slam(str, x, y, size, col, k) { ctx.save(); ctx.translate(x, y); const sc = 1 + 0.6 * Math.max(0, 1 - k * 5); ctx.scale(sc, sc); txt(str, 0, 0, size, col, 'center', '#0b0914'); ctx.restore(); }
function plate(f, left, k) {
  const st = f.style, off = (1 - ease(k)) * 560 * (left ? -1 : 1), d = left ? 0 : W, sg = left ? 1 : -1;
  ctx.save(); ctx.translate(off, 0);
  ctx.fillStyle = 'rgba(8,6,20,.85)'; ctx.beginPath(); ctx.moveTo(d, H - 196); ctx.lineTo(d + sg * 580, H - 196); ctx.lineTo(d + sg * 540, H - 84); ctx.lineTo(d, H - 84); ctx.closePath(); ctx.fill();
  ctx.fillStyle = st.aura; ctx.beginPath(); ctx.moveTo(d + sg * 580, H - 196); ctx.lineTo(d + sg * 596, H - 196); ctx.lineTo(d + sg * 556, H - 84); ctx.lineTo(d + sg * 540, H - 84); ctx.closePath(); ctx.fill();
  txt(st.name, left ? 40 : W - 40, H - 152, 84, '#f4ecd8', left ? 'left' : 'right', '#0b0914');
  txt(st.tag, left ? 44 : W - 44, H - 105, 30, st.aura, left ? 'left' : 'right', '#0b0914');
  ctx.restore();
}
function drawVS() {
  const t = G.phaseT;
  bars(Math.min(ease(t / 0.5), ease((4.5 - t) / 0.4)));
  if (t > 0.2 && t < 1.7) { ctx.globalAlpha = Math.min(1, (1.7 - t) / 0.2); plate(P, true, (t - 0.2) / 0.4); ctx.globalAlpha = 1; }
  if (t > 1.5 && t < 2.9) { ctx.globalAlpha = Math.min(1, (2.9 - t) / 0.2); plate(E, false, (t - 1.5) / 0.4); ctx.globalAlpha = 1; }
  if (t > 2.9) {
    const k = t - 2.9;
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, 0.85 - k * 3.5) + ')'; ctx.fillRect(0, 0, W, H);
    slam('VS', W / 2, H / 2 - 30, 230, '#ffcf3a', k);
    txt(P.style.name, 40, 100, 64, '#f4ecd8', 'left', '#0b0914'); txt(E.style.name, W - 40, 100, 64, '#f4ecd8', 'right', '#0b0914');
  }
}
function drawVictory() {
  const t = G.phaseT, w = G.winner;
  bars(Math.min(ease(t / 0.6), ease((6.5 - t) / 0.4)));
  if (t > 2.0) {
    const k = t - 2.0, a = clamp(k * 4, 0, 1);
    ctx.save(); ctx.globalAlpha = a * 0.55; const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, w.style.aura); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, H - 262, W, 120); ctx.restore();
    ctx.globalAlpha = a; slam(w.style.name, W / 2, H - 205, 120, '#ffcf3a', k); txt('ПОБЕЖДАЕТ', W / 2, H - 135, 54, '#f4ecd8', 'center', '#0b0914'); ctx.globalAlpha = 1;
  }
}
function drawOverlay() {
  if (G.phase === 'fatal') { drawFatalUI(); return; }
  if (G.phase === 'fatality') {
    bars(Math.min(ease(G.phaseT / .5), ease((FD[G.fx.k] - G.phaseT) / .4)));
    if (G.ann) { const kk = G.phaseT - G.ann, w = G.winner; slam('MEGA PUNCH', W / 2, H - 190, 110, '#e01010', kk); txt((w.style === STYLES.max ? 'MAX AND MIX' : w.style.say.toUpperCase()) + ' WINS', W / 2, H - 120, 54, '#f4ecd8', 'center', '#000'); }
    return;
  }
  if (G.phase === 'vs') { drawVS(); return; }
  if (G.phase === 'victory') { drawVictory(); return; }
  if (G.phase === 'roundEnd') bars(ease(G.phaseT / 0.5));
  if (G.phase === 'intro') {
    if (G.phaseT < 1.1) banner('РАУНД ' + G.round, 110, '#f4ecd8', G.phaseT);
    else banner('ДРАКА!', 130, '#ff6a2b', G.phaseT - 1.1);
  } else if (G.phase === 'roundEnd') {
    if (G.phaseT < 1.4) banner(G.endText, 130, '#ff6a2b', G.phaseT);
    else if (G.winner) banner(G.winner.style.name + ' ПОБЕЖДАЕТ', 90, '#ffcf3a', G.phaseT - 1.4);
  } else if (G.phase === 'matchEnd') {
    ctx.fillStyle = 'rgba(6,4,16,.6)'; ctx.fillRect(0, 0, W, H);
    const win = G.winner === P;
    banner(win ? 'ТЫ ПОБЕДИЛ!' : 'ПОРАЖЕНИЕ', 130, win ? '#ffcf3a' : '#ff6a4a', G.phaseT);
    if (G.phaseT > 1) txt('Нажмите, чтобы сыграть ещё раз', W / 2, H / 2 + 70, 36, '#f4ecd8', 'center', '#0b0914');
  } else if (G.phase === 'title') {
    ctx.fillStyle = 'rgba(6,4,16,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, 150);
    const gr = ctx.createLinearGradient(0, -60, 0, 60); gr.addColorStop(0, '#ffe08a'); gr.addColorStop(1, '#ff5a2a');
    let ts = 150; ctx.font = ts + 'px ' + FONT;
    const tw = ctx.measureText('АРЕНА ТЕНЕЙ').width; if (tw > W - 80) { ts = Math.floor(ts * (W - 80) / tw); ctx.font = ts + 'px ' + FONT; }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeStyle = '#0b0914'; ctx.lineJoin = 'round'; ctx.strokeText('АРЕНА ТЕНЕЙ', 0, 0);
    ctx.fillStyle = gr; ctx.fillText('АРЕНА ТЕНЕЙ', 0, 0); ctx.restore();
    if (Math.sin(G.t * 4) > -0.3) txt('Нажмите, чтобы начать', W / 2, 290, 44, '#f4ecd8', 'center', '#0b0914');
    txt('Победи в двух раундах из трёх.', W / 2, 350, 28, '#d8c9b0', 'center', '#0b0914');
    txt('Клавиатура: ← → ↑ ↓ или WASD, J рука, K нога, L блок, пробел супер', W / 2, 388, 22, '#b9a98f', 'center', '#0b0914');
  }
}

// ---------- кадр ----------
function render() {
  const dpr = cv.width / W;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  const sh = G.shake;
  if (sh > 0) ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  if (G.roll) { ctx.translate(W / 2, H / 2); ctx.rotate(G.roll); ctx.translate(-W / 2, -H / 2); ctx.fillStyle = '#000'; ctx.fillRect(-400, -400, W + 800, H + 800); }
  drawBackground();
  ctx.translate(W / 2, G.piv); ctx.scale(G.zoom, G.zoom); ctx.translate(-W / 2, -G.piv);
  ctx.translate(-G.cam, 0);
  drawFloor(); drawBraziers(); darken();
  if (G.phase === 'victory' && G.winner.style.kind === 'zha' && G.phaseT > 2.0) { // паутина
    const k = ease((G.phaseT - 2.0) / 1.0), w = G.winner, cx0 = w.x, cy0 = GROUND - 90;
    ctx.strokeStyle = 'rgba(255,235,150,.75)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(cx0 + Math.cos(an) * 170 * k, cy0 + Math.sin(an) * 170 * k); ctx.stroke(); }
    for (const rr of [50, 95, 140]) { ctx.beginPath(); for (let i = 0; i <= 8; i++) { const an = i * Math.PI / 4, x = cx0 + Math.cos(an) * rr * k, y = cy0 + Math.sin(an) * rr * k; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.stroke(); }
  }
  const order = P.y > E.y || P.state === 'attack' ? [E, P] : [P, E];
  order.forEach(drawFighter);
  if (G.mix && (G.phase === 'victory' || G.phase === 'fatality')) drawFighter(G.mix);
  shots.forEach(drawShot); drawFx();
  for (const r of rings) { ctx.globalAlpha = clamp(r.life / 0.28, 0, 1); ctx.strokeStyle = r.col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, GROUND - r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // виньетка
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (G.phase !== 'vs' && G.phase !== 'victory' && G.phase !== 'menu' && G.phase !== 'fatality') drawHUD();
  drawOverlay();
}

// ---------- меню ----------
let sel = 'jason';
try { const sv = localStorage.getItem('arena.sel'); if (sv && ROSTER.includes(sv)) sel = sv; } catch (e) {}
let menuOpen = true, cur = 'fight', animT = 0;
const menuEl = $('menu'), tabs = [...document.querySelectorAll('.tab')], panels = {};
document.querySelectorAll('.panel').forEach((pn) => { panels[pn.dataset.p] = pn; });
function showTab(name, first) {
  if (name === cur && !first) return;
  const prevP = first ? null : panels[cur], next = panels[name];
  cur = name;
  tabs.forEach((t) => t.classList.toggle('active', t.dataset.t === name));
  for (const k in panels) if (panels[k] !== next && panels[k] !== prevP) panels[k].classList.remove('active', 'enter', 'leave');
  if (prevP && prevP !== next) { prevP.classList.remove('enter'); prevP.classList.add('active', 'leave'); }
  next.classList.remove('leave', 'enter'); next.classList.add('active'); void next.offsetWidth; next.classList.add('enter');
  clearTimeout(animT);
  animT = setTimeout(() => { for (const k in panels) if (panels[k] !== next) panels[k].classList.remove('active', 'leave', 'enter'); next.classList.remove('enter'); }, 650);
  if (!first) SFX.ui();
}
tabs.forEach((t) => t.addEventListener('click', () => { audioInit(); showTab(t.dataset.t); }));

const prevs = [];
function mkPrev(cvEl, key) {
  const o = { cv: cvEl, f: makeFighter(STYLES[key], false), g: null };
  o.f.face = 1; if (key === 'max') { o.g = makeFighter(STYLES.mix, false); o.g.face = 1; }
  prevs.push(o); return o;
}
function drawPreview(o, dt) {
  const c = o.cv, dpr = Math.min(window.devicePixelRatio || 1, 2), w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const pc = c.getContext('2d'); ctx = pc;
  pc.setTransform(1, 0, 0, 1, 0, 0); pc.clearRect(0, 0, c.width, c.height);
  const k = h / 250;
  pc.setTransform(k * dpr, 0, 0, k * dpr, (w / 2) * dpr, (h - 8 - GROUND * k) * dpr);
  for (const [f, x] of (o.g ? [[o.g, 62], [o.f, -38]] : [[o.f, 0]])) { f.t += dt; updatePose(f, dt); f.x = x; drawFighter(f); }
  ctx = mainCtx;
}
const selPrev = mkPrev($('selPrev'), sel);
const rosterEl = $('roster');
ROSTER.forEach((key) => {
  const sd = STYLES[key], card = document.createElement('button');
  card.className = 'card'; card.dataset.k = key;
  card.innerHTML = '<canvas></canvas><div class="cn">' + sd.name + '</div><div class="cm">' + sd.list.join(' • ') + '</div><div class="cs">СУПЕР: ' + sd.supText + '</div><div class="ok">ВЫБРАН</div>';
  mkPrev(card.querySelector('canvas'), key);
  card.addEventListener('click', () => { audioInit(); chooseFighter(key); SFX.ui(); });
  rosterEl.appendChild(card);
});
function chooseFighter(key) {
  sel = key; try { localStorage.setItem('arena.sel', key); } catch (e) {}
  rosterEl.querySelectorAll('.card').forEach((c) => c.classList.toggle('sel', c.dataset.k === key));
  $('selName').textContent = STYLES[key].name;
  selPrev.f = makeFighter(STYLES[key], false); selPrev.f.face = 1;
  selPrev.g = key === 'max' ? makeFighter(STYLES.mix, false) : null; if (selPrev.g) selPrev.g.face = 1;
}
chooseFighter(sel);
showTab('fight', true);

$('goFight').addEventListener('click', () => {
  audioInit(); SFX.ui(); try { const u0 = new SpeechSynthesisUtterance(' '); u0.volume = 0; window.speechSynthesis.speak(u0); } catch (e) {} menuEl.classList.add('hide');
  setTimeout(() => { menuOpen = false; menuEl.style.display = 'none'; document.body.classList.add('fight'); startMatch(); }, 320);
});
$('back').addEventListener('pointerdown', (e) => {
  e.stopPropagation(); e.preventDefault();
  for (const k in hold) hold[k] = 0;
  shots.length = 0; parts.length = 0; rings.length = 0; G.phase = 'menu'; G.slow = 0; G.hitstop = 0; G.dk = 0; G.hd = null; G.beam = 0; G.spir = 0; G.roll = 0;
  document.body.classList.remove('fight'); menuOpen = true; menuEl.style.display = ''; void menuEl.offsetWidth; menuEl.classList.remove('hide');
  showTab('fight', true);
});

let last = performance.now();
function frame(now) {
  const dtReal = Math.min(0.033, (now - last) / 1000); last = now;
  if (menuOpen) { G.t += dtReal; prevs.forEach((o) => drawPreview(o, dtReal)); }
  else { step(dtReal); updatePose(P, dtReal); updatePose(E, dtReal); render(); }
  requestAnimationFrame(frame);
}
// начальная расстановка для экрана заставки
P.x = WORLD / 2 - 170; E.x = WORLD / 2 + 170; E.face = -1; G.cam = WORLD / 2 - W / 2;
requestAnimationFrame(frame);
window.__game = { G, P, E, hold, q };
})();
</script>
